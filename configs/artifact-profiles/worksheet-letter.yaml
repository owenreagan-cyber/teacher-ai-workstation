name: worksheet-letter
artifact_type: pdf
paper:
  width_points: 612
  height_points: 792
  orientation: portrait
  size_tolerance_points: 2
margins:
  top_inches: 0.50
  bottom_inches: 0.50
  left_inches: 0.55
  right_inches: 0.55
safe_boundary_inches: 0.35
page_utilization:
  warning_below_percent: 70
  bottom_gap_warning_inches: 2.25
  boundary_warning_inches: 0.10
  blank_page_text_threshold: 5
requirements:
  page_numbers_after_first: false
  render_pages: false
  teacher_key_must_match_page_count: true
  require_single_line_sentences: false
  min_body_font_pt: 12.5
  max_body_font_pt: 14.0
printing:
  scale: actual-size
  percent: 100
subject_extensions:
  math:
    computation_space_inches: 0.35
  reading:
    passage_distinct: true
